<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ftv Services</title>

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --status-online: #22c55e;
      --status-offline: #ef4444;
      --status-checking: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      position: relative;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .card-icon {
      font-size: 1.8rem;
      color: var(--accent);
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--status-checking);
    }

    .dot.online { background: var(--status-online); }
    .dot.offline { background: var(--status-offline); }

    .visit-btn {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .visit-btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="particles-js"></div>

  <div class="container">
    <header>
      <h1>ESER-ALL PORTAL</h1>
      <p style="color: var(--text-muted)">All-in-one Services & Server Dashboard</p>
    </header>

    <div class="nav-tabs" id="category-tabs">
      <button class="tab-btn active" onclick="filterCategory('all')">All</button>
      <button class="tab-btn" onclick="filterCategory('ftp')">FTP Servers</button>
      <button class="tab-btn" onclick="filterCategory('tv')">Live TV</button>
      <button class="tab-btn" onclick="filterCategory('gov')">Government</button>
      <button class="tab-btn" onclick="filterCategory('edu')">Admission</button>
      <button class="tab-btn" onclick="filterCategory('ticket')">Ticketing</button>
    </div>

    <div class="grid" id="links-grid"></div>
  </div>

  <script>
    // Initialize EmailJS & Firebase Configurations
    (function() {
      emailjs.init("k3Gz4cI70F4UTep3c");
    })();

    const firebaseConfig = {
      apiKey: "AIzaSyDB4r_a5gPtKhlzM0qqmYHBb6HA_I2SmHQ",
      authDomain: "eser-all.firebaseapp.com",
      databaseURL: "http://eser-all-default-rtdb.firebaseio.com",
      projectId: "eser-all",
      storageBucket: "eser-all.appspot.com",
      messagingSenderId: "741870576674",
      appId: "1:741870576674:web:2a5094bd05f44f0b98d67b"
    };
    
    firebase.initializeApp(firebaseConfig);

    // De-obfuscated Dashboard Services List
    const services = [
      { name: "Sam FTP", url: "http://172.16.50.4/", category: "ftp", icon: "fa-server" },
      { name: "Crazy HD", url: "http://crazyhd.com/", category: "ftp", icon: "fa-film" },
      { name: "Ctg Movies", url: "https://ctgmovies.com/", category: "ftp", icon: "fa-video" },
      { name: "Ghuri FTP", url: "http://103.96.104.6//", category: "ftp", icon: "fa-folder-open" },
      { name: "ICC FTP", url: "http://10.16.100.244/dashboard.php", category: "ftp", icon: "fa-hard-drive" },
      { name: "Live TV 1", url: "http://172.28.28.54/", category: "tv", icon: "fa-tv" },
      { name: "Live TV 2", url: "http://172.19.178.180/", category: "tv", icon: "fa-desktop" },
      { name: "NID Services", url: "https://services.nidw.gov.bd/", category: "gov", icon: "fa-id-card" },
      { name: "Birth Registration", url: "https://bdris.gov.bd/", category: "gov", icon: "fa-file-invoice" },
      { name: "e-Passport", url: "https://epassport.gov.bd/", category: "gov", icon: "fa-passport" },
      { name: "Police Clearance", url: "https://pcc.police.gov.bd/", category: "gov", icon: "fa-shield-halved" },
      { name: "e-TIN Income Tax", url: "https://incometax.gov.bd/", category: "gov", icon: "fa-calculator" },
      { name: "GST Admission", url: "https://gstadmission.ac.bd/", category: "edu", icon: "fa-graduation-cap" },
      { name: "DU Admission", url: "https://duadmission.eis.du.ac.bd/", category: "edu", icon: "fa-university" },
      { name: "BD Railway Ticket", url: "https://eticket.railway.gov.bd/", category: "ticket", icon: "fa-train" },
      { name: "Shohoz Bus Ticket", url: "https://shohoz.com/bus-tickets", category: "ticket", icon: "fa-bus" }
    ];

    // Render Grid Cards
    function renderGrid(filter = 'all') {
      const grid = document.getElementById('links-grid');
      grid.innerHTML = '';

      services.forEach((item, index) => {
        if (filter !== 'all' && item.category !== filter) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <i class="fa-solid ${item.icon} card-icon"></i>
            <div class="card-title">${item.name}</div>
          </div>
          <div class="card-footer">
            <div class="status-indicator">
              <span class="dot" id="dot-${index}"></span>
              <span id="status-${index}">Checking...</span>
            </div>
            <a href="${item.url}" target="_blank" class="visit-btn">Visit</a>
          </div>
        `;
        grid.appendChild(card);
        checkStatus(item.url, index);
      });
    }

    // Ping mechanism to test local/external link connectivity
    function checkStatus(url, index) {
      const img = new Image();
      const dot = document.getElementById(`dot-${index}`);
      const text = document.getElementById(`status-${index}`);

      const timeout = setTimeout(() => {
        if (text) {
          text.textContent = 'Offline';
          dot.className = 'dot offline';
        }
      }, 5000);

      img.onload = function () {
        clearTimeout(timeout);
        if (text) {
          text.textContent = 'Online';
          dot.className = 'dot online';
        }
      };

      img.onerror = function () {
        clearTimeout(timeout);
        if (text) {
          text.textContent = 'Online'; // Responded (even with cross-origin load error)
          dot.className = 'dot online';
        }
      };

      img.src = url + "/favicon.ico?" + new Date().getTime();
    }

    function filterCategory(cat) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderGrid(cat);
    }

    // Initialize Page
    renderGrid();

    // Completed ParticlesJS Config (Restored from broken tail)
    particlesJS("particles-js", {
      particles: {
        number: { value: 60, density: { enable: true, value_area: 800 } },
        color: { value: "#38bdf8" },
        shape: { type: "circle" },
        opacity: { value: 0.3, random: false },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#38bdf8",
          opacity: 0.2,
          width: 1
        },
        move: {
          enable: true,
          speed: 2,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out",
          bounce: false
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
