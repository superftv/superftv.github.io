        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                min-height: 100%;
                font-family: 'Segoe UI', Arial, sans-serif;
            }

            body {
                margin: 0;
                padding: 0;
                background: #121212;
                color: #f0f0f0;
                transition: background .3s, color .3s;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                position: relative;
            }

            body.light-mode {
                background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
                background-size: 400% 400%;
                animation: gradientBG 15s ease infinite;
                color: #fff;
            }

            @keyframes gradientBG {
                0% { background-position: 0 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0 50%; }
            }

            #particles-js {
                position: fixed;
                width: 100%;
                height: 100%;
                z-index: 0;
            }

            .theme-toggle {
                position: fixed;
                left: 20px;
                bottom: 20px;
                width: 42px;
                height: 42px;
                border-radius: 50%;
                border: 2px solid #fff;
                background: rgba(255, 255, 255, .1);
                color: #fff;
                font-size: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 1000;
            }

            .dashboard {
                position: relative;
                z-index: 1;
                padding: 30px 15px 10px;
                text-align: center;
            }

            .main-header {
                font-size: 32px;
                font-weight: 800;
                margin-bottom: 25px;
                margin-top: 10px;
                letter-spacing: .5px;
            }

            .section-title {
                font-size: 24px;
                margin: 30px 0 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
            }

            .section-title i {
                color: #38bdf8;
            }

            .link-container {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 15px;
                max-width: 950px;
                margin: 0 auto 20px auto;
            }

            .link-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 16px;
                background: rgba(255, 255, 255, .08);
                border: 1px solid rgba(255, 255, 255, .15);
                border-radius: 12px;
                color: #fff;
                backdrop-filter: blur(6px);
                font-size: 14px;
                font-weight: 600;
                box-shadow: 0 8px 10px rgba(0, 0, 0, .4);
                position: relative;
                width: 160px;
                min-height: 110px;
                transition: transform .2s, background .2s;
                cursor: pointer;
                text-align: center;
            }

            .link-card:hover {
                transform: translateY(-3px);
                background: rgba(255, 255, 255, .18);
            }

            .link-card i.main-icon {
                font-size: 32px;
                margin-bottom: 8px;
                color: #38bdf8;
                transition: transform .2s ease;
            }

            .link-card:hover i.main-icon {
                transform: scale(1.1);
            }

            .link-card .card-title {
                width: 100%;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                text-overflow: ellipsis;
                word-break: break-word;
                line-height: 1.3;
            }

            .status-badge {
                position: absolute;
                top: 6px;
                right: 6px;
                font-size: 9px;
                padding: 2px 5px;
                border-radius: 10px;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 3px;
            }

            .status-badge.online {
                background: rgba(76, 175, 80, .25);
                color: #4CAF50;
                border: 1px solid #4CAF50;
            }

            .status-badge.offline {
                background: rgba(244, 67, 54, .25);
                color: #f44336;
                border: 1px solid #f44336;
            }

            .status-badge.checking {
                background: rgba(255, 193, 7, .25);
                color: #ffc107;
                border: 1px solid #ffc107;
            }

            .email-modal, .user-login-modal {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, .85);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 999;
            }

            .modal-content {
                background: #1e1e1e;
                color: #fff;
                padding: 20px;
                border-radius: 10px;
                width: 320px;
                border: 1px solid #333;
                text-align: center;
                position: relative;
            }

            .modal-content input, .modal-content textarea {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #444;
                background: #2a2a2a;
                color: #fff;
                border-radius: 4px;
                outline: 0;
                font-family: inherit;
            }

            .modal-content textarea {
                resize: vertical;
                min-height: 80px;
            }

            .modal-content button {
                padding: 8px 12px;
                margin-top: 5px;
                cursor: pointer;
                border: none;
                border-radius: 4px;
                font-weight: 700;
                background: #4CAF50;
                color: #fff;
                width: 100%;
            }

            .close-btn {
                position: absolute;
                top: 10px;
                right: 12px;
                font-size: 16px;
                color: #fff;
                cursor: pointer;
            }

            .divider {
                display: flex;
                align-items: center;
                text-align: center;
                margin: 15px 0;
                color: #888;
                font-size: 12px;
            }

            .divider::after, .divider::before {
                content: '';
                flex: 1;
                border-bottom: 1px solid #444;
            }

            .divider:not(:empty)::before { margin-right: .5em; }
            .divider:not(:empty)::after { margin-left: .5em; }

            .google-btn {
                background: #fff!important;
                color: #333!important;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                border: 1px solid #ccc!important;
            }

            .logout-btn {
                position: fixed;
                right: 20px;
                bottom: 20px;
                padding: 10px 18px;
                border-radius: 20px;
                border: none;
                background: #e11d48;
                color: #fff;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                z-index: 1000;
                box-shadow: 0 4px 10px rgba(225, 29, 72, .3);
            }

            .developer-footer {
                position: relative;
                z-index: 1;
                text-align: center;
                padding: 15px 10px;
                font-size: 14px;
                background: rgba(0, 0, 0, .4);
                backdrop-filter: blur(4px);
                margin-top: 30px;
            }

            .developer-footer span {
                font-weight: 700;
                color: #00e676;
            }
        </style>
